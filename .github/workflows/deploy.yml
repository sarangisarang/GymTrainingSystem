# Continuous Deployment for Issue #15.
#
# Flow: push to main → CI (test + build + docker-build) → this workflow → Render/Railway.
#
# The deploy job runs ONLY after the CI workflow succeeds on `main`, so failing
# tests or broken Docker images can never reach production. The actual deploy
# step is gated on whichever platform secret is configured, so this file can be
# merged before any cloud account exists: it will log a clear notice and exit
# successfully until RENDER_DEPLOY_HOOK_URL (or RAILWAY_TOKEN) is added under
# Settings → Secrets and variables → Actions.
#
# Setup is documented in README.md → Deployment (Render / Railway).

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Lets maintainers redeploy the current main without pushing a new commit
  # (e.g. after rotating a secret on the platform side).
  workflow_dispatch:

# One deploy at a time per environment. We don't cancel in-progress runs because
# a half-finished deploy that gets killed mid-rollout is worse than waiting.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Least privilege: this workflow only checks out the repo and POSTs to external
# deploy URLs. It writes nothing back to GitHub.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    # For the workflow_run trigger, only deploy when CI passed. workflow_dispatch
    # runs unconditionally (the maintainer chose to trigger it).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    # Secrets can't be referenced in `if:` directly. Mirror them into env so the
    # individual step gates below work.
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      # Check out the exact commit that passed CI (not whatever HEAD is now),
      # so a fast follow-up push doesn't accidentally piggy-back on this run.
      - name: Checkout commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log deploy target
        run: |
          echo "Deploying commit: ${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "Triggered by: ${{ github.event_name }}"

      # ── Render (primary) ──────────────────────────────────────────────────
      # Render's Deploy Hook is a one-shot URL: POSTing to it tells Render to
      # pull the latest commit on its connected branch, rebuild the Docker image
      # from backend/Dockerfile, and roll the running service. We don't ship the
      # image from CI; Render does its own build to keep the secret surface small.
      - name: Trigger Render backend deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          status=$(echo "$response" | grep '^HTTP_STATUS:' | cut -d: -f2)
          body=$(echo "$response" | grep -v '^HTTP_STATUS:' || true)
          echo "Render response (HTTP $status): $body"
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "::error::Render deploy hook returned HTTP $status"
            exit 1
          fi
          echo "::notice::Render backend deploy triggered. Watch progress in the Render dashboard."

      - name: Trigger Render frontend deploy
        if: ${{ env.RENDER_FRONTEND_DEPLOY_HOOK_URL != '' }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_FRONTEND_DEPLOY_HOOK_URL")
          status=$(echo "$response" | grep '^HTTP_STATUS:' | cut -d: -f2)
          body=$(echo "$response" | grep -v '^HTTP_STATUS:' || true)
          echo "Render response (HTTP $status): $body"
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "::error::Render frontend deploy hook returned HTTP $status"
            exit 1
          fi
          echo "::notice::Render frontend deploy triggered."

      # ── Railway (alternative) ─────────────────────────────────────────────
      # Activated by setting the RAILWAY_TOKEN secret. The CLI reads the linked
      # project from railway.json (or RAILWAY_PROJECT_ID env) and pushes the
      # current working tree as a new build.
      - name: Setup Node for Railway CLI
        if: ${{ env.RAILWAY_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Railway
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: |
          set -euo pipefail
          npm install -g @railway/cli
          railway up --service backend --detach
          echo "::notice::Railway deploy triggered."

      # ── Fallback notice ───────────────────────────────────────────────────
      # When no platform secret is configured, the workflow still succeeds and
      # prints a clear next-step. This lets the file land on main before a
      # Render/Railway account exists, instead of forcing a chicken-and-egg PR.
      - name: No deploy target configured
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' && env.RENDER_FRONTEND_DEPLOY_HOOK_URL == '' && env.RAILWAY_TOKEN == '' }}
        run: |
          cat <<'EOF'
          ::warning::No deploy target configured. CI passed, but nothing was deployed.

          To enable automatic deployment, add ONE of these repository secrets
          (Settings → Secrets and variables → Actions):

            RENDER_DEPLOY_HOOK_URL           Render backend service deploy hook
            RENDER_FRONTEND_DEPLOY_HOOK_URL  (optional) Render frontend service deploy hook
            RAILWAY_TOKEN                    Railway project token

          See README.md → Deployment for step-by-step setup.
          EOF
